# Local development stack: `make up` (see README.md). Not a production deployment.
# Run through the Makefile, which passes `--project-directory .` and `--env-file .env`,
# so every relative path below is relative to the repository root.
name: recap

x-backend: &backend
  build:
    context: .
    dockerfile: infra/backend.Dockerfile
  env_file: .env
  environment:
    # Inside the Compose network the database is the `db` service, whatever .env says.
    DATABASE_URL: postgres://${POSTGRES_USER:-recap}:${POSTGRES_PASSWORD:-recap}@db:5432/${POSTGRES_DB:-recap}
    HOST: 0.0.0.0
    PORT: 3001
    UPLOAD_DIR: /data/uploads
  volumes:
    # Source is mounted so `tsx watch` reloads on change; node_modules stay in the image.
    - ./backend/src:/app/backend/src
    - ./backend/drizzle:/app/backend/drizzle
    - uploads:/data/uploads

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recap}
      POSTGRES_DB: ${POSTGRES_DB:-recap}
    ports:
      # 5433 on the host, so it does not collide with a local PostgreSQL on 5432.
      - '${DB_HOST_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-recap} -d ${POSTGRES_DB:-recap}']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend
    # Migrations and the settings seed are idempotent, so they run on every start.
    command: sh -c "npm run db:migrate && npm run db:seed && npm run dev"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${BACKEND_HOST_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    <<: *backend
    command: npm run dev:worker
    # Memory (Segment 2C, Q54). The worker reads untrusted PDF files in a child process whose HEAP is
    # limited to PDF_EXTRACT_MEMORY_MB (512), but what a hostile file makes it allocate outside the
    # heap is not limited by that. This is the net: 768 MB, above the 512 MB of the child, so that
    # a hostile file costs the child (the kernel kills the biggest process), not the host.
    mem_limit: 768m
    # Stopping (Segment 2C). On SIGTERM the worker takes no new document and lets the one in hand
    # finish, which DOCUMENT_PROCESSING_TIMEOUT_SECONDS (60) bounds. THE RULE:
    #     stop_grace_period  >  DOCUMENT_PROCESSING_TIMEOUT_SECONDS + a margin    (75 s > 60 s + 15 s)
    # If the grace period were shorter, Docker would kill the worker with a document half read and
    # that document would end as an error. If you raise the time limit, raise this too.
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-75s}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:3001
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/index.html:/app/frontend/index.html
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_HOST_PORT:-5173}:5173'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  db-data:
  uploads:
